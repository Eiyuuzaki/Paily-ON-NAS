# Paily ON NAS —— 管理界面 nginx 配置
#
# 用法：把 paily-frontend 的构建产物放到 ./ui/dist，然后
#   docker compose --profile ui up -d
#
# 访问 http://<NAS-IP>:21381

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理 API —— 同源反代，因此不需要处理 CORS
    location /api/ {
        proxy_pass http://core:21380;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 公开订阅地址，方便在界面上直接复制测试
    location /clash   { proxy_pass http://core:21380; }
    location /singbox { proxy_pass http://core:21380; }
    location /base64  { proxy_pass http://core:21380; }
}