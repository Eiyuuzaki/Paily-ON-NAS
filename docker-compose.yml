# =====================================================================
# Paily ON NAS —— Docker Compose 编排
#
# 快速开始：
#   cp .env.example .env                 # 修改里面的 CHANGE_ME 密钥
#   cp etc/core.yaml.example  etc/core.yaml
#   cp etc/check.yaml.example etc/check.yaml
#   # 把 .env 里的 CHECKER_SECRET 同步填进 etc/core.yaml 与 etc/check.yaml
#   docker compose up -d
#
# 订阅地址（CORE_PORT 默认 21380）：
#   http://<NAS-IP>:21380/clash       Clash / mihomo
#   http://<NAS-IP>:21380/singbox     Sing-box
#   http://<NAS-IP>:21380/base64      通用 Base64
#
# 免责声明：仅供个人学习研究自用，严禁商业用途或对外提供服务，详见 README。
# =====================================================================
name: paily-on-nas

services:
  # ─────────────────────────────────────────────────────────────── 数据库
  postgres:
    image: postgres:16-alpine
    container_name: paily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paily
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: paily
      TZ: ${TZ:-Asia/Shanghai}
      # 放在子目录里，避免部分 NAS 上绑定挂载的权限问题
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paily -d paily"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "5432"
    networks:
      - paily

  # ───────────────────────────────────────────────────── 主服务（中枢）
  # 两种用法，任选其一：
  #   1) 本地已有镜像（默认）：先用 `docker build -t paily-on-nas/core:local .` 构建好
  #   2) 从源码构建：取消下面 build 段的注释，并确保仓库源码在 build context 内
  core:
    image: paily-on-nas/core:local
    # 从源码构建时取消下面注释（需要仓库源码在 build context 内）：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     TARGETARCH: ${TARGETARCH:-arm64}
    container_name: paily-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 覆盖配置文件里的占位 DSN，密钥只维护在 .env 一处
      PAILY_DATABASE_DSN: "host=postgres port=5432 user=paily password=${POSTGRES_PASSWORD} dbname=paily sslmode=disable TimeZone=${TZ:-Asia/Shanghai}"
      PAILY_AUTH_ADMIN_PASSWORD: ${PAILY_ADMIN_PASSWORD:?请在 .env 中设置 PAILY_ADMIN_PASSWORD}
      PAILY_AUTH_SERVICE_SECRET: ${PAILY_SERVICE_SECRET:?请在 .env 中设置 PAILY_SERVICE_SECRET}
      PAILY_AUTH_JWT_SECRET: ${PAILY_JWT_SECRET:?请在 .env 中设置 PAILY_JWT_SECRET}
    volumes:
      - ./etc/core.yaml:/app/config.yaml:ro
    ports:
      - "${CORE_PORT:-21380}:21380"
    networks:
      - paily

  # ───────────────────────────────────────────────────────────── 抓取服务
  # paily-fetch 的服务端不在本仓库（third_party 里只有它的库代码）。
  # 二进制来自本仓库的 Release 页面，按架构下载后放到 ./bin/ 下。
  fetch:
    image: alpine:3.21
    container_name: paily-fetch
    restart: unless-stopped
    depends_on:
      - core
    command: ["/app/paily-fetch"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PAILY_CORE_URL: "http://core:21380"
      # 抓取服务用主服务的 service_secret
      PAILY_SERVICE_SECRET: ${PAILY_SERVICE_SECRET:?请在 .env 中设置 PAILY_SERVICE_SECRET}
      FETCH_INTERVAL: ${FETCH_INTERVAL:-10800}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-16}
      FETCH_UA: ${FETCH_UA:-clash-verge/v1.0.0}
    volumes:
      - ./bin/paily-fetch:/app/paily-fetch:ro
    networks:
      - paily

  # ───────────────────────────────────────────────────────────── 测活服务
  # 同上，二进制来自 Release，放到 ./bin/ 下
  check:
    image: alpine:3.21
    container_name: paily-check
    restart: unless-stopped
    depends_on:
      - core
    command: ["/app/paily-check", "--config", "/app/config.yaml"]
    # ！重要！容器默认 nofile 只有 1024，高并发测活会耗尽文件描述符，
    # 表现为进度卡死、CPU 掉到 0%。这里必须放宽，不要删。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PAILY_CORE_URL: "http://core:21380"
      # 注意：测活后端密钥即 etc/core.yaml 的 checkers[].secret，
      # 与抓取服务用的 service_secret 不是同一个值。
      CHECK_CRON: ${CHECK_CRON:-0 */2 * * * *}
      INITIAL_CONCURRENCY: ${INITIAL_CONCURRENCY:-64}
      INITIAL_PING_URL: ${INITIAL_PING_URL:-http://www.gstatic.com/generate_204}
      INITIAL_PING_TIMEOUT_MS: ${INITIAL_PING_TIMEOUT_MS:-6000}
      INITIAL_ALIVE_THRESHOLD_MS: ${INITIAL_ALIVE_THRESHOLD_MS:-6000}
      DEEP_PING_CONCURRENCY: ${DEEP_PING_CONCURRENCY:-24}
      DEEP_PING_TIMEOUT_MS: ${DEEP_PING_TIMEOUT_MS:-6000}
      DEEP_PING_FILTER_DEAD: ${DEEP_PING_FILTER_DEAD:-true}
      GEO_MODE: ${GEO_MODE:-native_api}
      SPEED_ENABLED: ${SPEED_ENABLED:-false}
      SCRIPT_DIR: "/app/scripts"
      SCRIPT_CONCURRENCY: "16"
      PROGRESS_BAR: ${PROGRESS_BAR:-false}
    volumes:
      - ./bin/paily-check:/app/paily-check:ro
      - ./etc/check.yaml:/app/config.yaml:ro
      - ./scripts:/app/scripts:ro
    networks:
      - paily

  # ──────────────────── 可选：Web 管理界面（docker compose --profile ui up -d）
  # 需要先把 paily-frontend 的构建产物放到 ./ui/dist
  ui:
    profiles: ["ui"]
    image: nginx:alpine
    container_name: paily-ui
    restart: unless-stopped
    depends_on:
      - core
    volumes:
      - ./ui/dist:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${UI_PORT:-21381}:80"
    networks:
      - paily

networks:
  paily:
    driver: bridge